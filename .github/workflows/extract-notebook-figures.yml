name: Extract notebook-native figures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-notebook-figures.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact PNG outputs from executed notebooks
        shell: python
        run: |
          import base64
          import hashlib
          import json
          from pathlib import Path

          mapping = {
              'notebooks/03_model_comparison.ipynb': [
                  'figures/main_sensor/final_model_comparison_plot.png',
              ],
              'notebooks/04_second_sensor_zero_shot.ipynb': [
                  'figures/second_sensor/second_sensor_comparison_plot.png',
              ],
              'notebooks/05_robustness_test.ipynb': [
                  'figures/robustness/robustness_mae_by_window.png',
                  'figures/robustness/robustness_rmse_by_window.png',
                  'figures/robustness/aggregate_robustness_mae.png',
                  'figures/robustness/aggregate_robustness_rmse.png',
                  'figures/uncertainty/w01_uncertainty_comparison.png',
                  'figures/uncertainty/w09_uncertainty_comparison.png',
              ],
          }

          expected_sha256 = {
              'figures/main_sensor/final_model_comparison_plot.png': '0419ab0c5b5a1ee744ecf5184dbcf40ca7cf0889e27d59c85d890bc3df274232',
              'figures/second_sensor/second_sensor_comparison_plot.png': '86c34b593999465a33245c4450584d9205ce0a511fb2f8a1358894f0c480c422',
              'figures/robustness/robustness_mae_by_window.png': 'beb830ffb762e5c89e53292766fff53780e89736f993f3fafdc96e0399547993',
              'figures/robustness/robustness_rmse_by_window.png': '78acf1e78c2ca5fc1fb34b716a5d59080fd22b67c347cf2b68f2c90d229fb5b6',
              'figures/robustness/aggregate_robustness_mae.png': 'c8ff56cf151a835c30eecb4629536409bb893d75f0447536fc5c7f9a3c0898fd',
              'figures/robustness/aggregate_robustness_rmse.png': '95bbd7541ab653b0e73433ae6759e4e7de50a9a6b78b2ee8c541cb2b70b4e2bd',
              'figures/uncertainty/w01_uncertainty_comparison.png': '02eb342c2cd770f7dad4a08cf4cc0b005ff85046d1f2147344e8bbb6ca20a237',
              'figures/uncertainty/w09_uncertainty_comparison.png': '3184307e8eae7d7994ac3f900a06d174193b87096b8d0dc9c4d5f9f69705886e',
          }

          for notebook_path, output_paths in mapping.items():
              notebook = json.loads(Path(notebook_path).read_text())
              png_outputs = []
              for cell in notebook['cells']:
                  for output in cell.get('outputs', []):
                      image = output.get('data', {}).get('image/png')
                      if image is not None:
                          png_outputs.append(base64.b64decode(''.join(image) if isinstance(image, list) else image))

              if len(png_outputs) != len(output_paths):
                  raise RuntimeError(
                      f'{notebook_path}: expected {len(output_paths)} PNG outputs, found {len(png_outputs)}'
                  )

              for payload, output_path in zip(png_outputs, output_paths):
                  if not payload.startswith(b'\x89PNG\r\n\x1a\n'):
                      raise RuntimeError(f'{output_path}: invalid PNG signature')
                  digest = hashlib.sha256(payload).hexdigest()
                  if digest != expected_sha256[output_path]:
                      raise RuntimeError(
                          f'{output_path}: SHA-256 mismatch: {digest} != {expected_sha256[output_path]}'
                      )
                  path = Path(output_path)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(payload)
                  print(f'PASS {output_path} {digest}')

      - name: Commit exact notebook-native figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/main_sensor figures/second_sensor figures/robustness figures/uncertainty
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "Add notebook-native experiment figures"
            git push
          fi
